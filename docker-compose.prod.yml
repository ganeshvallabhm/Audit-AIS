services:
  db:
    image: postgres:16-alpine
    container_name: companyaudit-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-companyaudit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting}
      POSTGRES_DB: ${POSTGRES_DB:-companyaudit}
    volumes:
      - companyaudit_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-companyaudit} -d $${POSTGRES_DB:-companyaudit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: companyaudit-prod-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_NAME: CompanyAudit Enterprise API
      API_PREFIX: /api
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-companyaudit}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-companyaudit}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set strong JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://companyaudit.local}
      EVIDENCE_STORAGE_DIR: /app/storage/evidence
      MAX_EVIDENCE_BYTES: ${MAX_EVIDENCE_BYTES:-26214400}
      ALLOW_DEMO_SEED: "false"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ENABLE_BACKGROUND_SCHEDULER: ${ENABLE_BACKGROUND_SCHEDULER:-true}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-900}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    volumes:
      - companyaudit_prod_evidence:/app/storage/evidence
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      start_period: 25s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: companyaudit-prod-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  companyaudit_prod_pgdata:
  companyaudit_prod_evidence:

